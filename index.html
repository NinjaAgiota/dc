<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114">
<title>MeetSpace — Videoconferência</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#101114;--panel:#191b20;--panel2:#252932;--text:#f4f5f7;--muted:#a1a5b0;--blue:#8ab4f8;--red:#ea4335;--border:#30333b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}#loginScreen{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#28385b 0,transparent 40%),radial-gradient(circle at 80% 80%,#29204b 0,transparent 40%),var(--bg);z-index:100}.login-card{width:100%;max-width:430px;padding:38px;border:1px solid var(--border);border-radius:22px;background:rgba(25,27,32,.96);box-shadow:0 20px 70px #0007}.logo{font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:12px}.logo span{color:var(--blue)}.login-card h1{font-size:28px;margin:25px 0 10px}.login-card p{color:var(--muted);line-height:1.6;font-size:14px}.login-card input{width:100%;margin:25px 0 15px;padding:15px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:white;outline:none}.login-card input:focus{border-color:var(--blue)}.primary-btn{width:100%;padding:15px;background:var(--blue);color:#101114;font-weight:700;border-radius:10px}.primary-btn:disabled{opacity:.6;cursor:wait}#loginError{color:#ff8c83;margin-top:12px;font-size:13px}#meetingScreen{display:none;height:100dvh;width:100%;flex-direction:column}.topbar{height:66px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}.topbar .logo{font-size:21px;margin:0}.room-info{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.copy-btn{padding:10px 15px;border-radius:8px;background:var(--panel2);color:white;border:1px solid var(--border);font-size:12px}.main-content{display:flex;flex:1;min-height:0;overflow:hidden}.video-area{flex:1;min-width:0;padding:18px;display:flex;align-items:center;justify-content:center;overflow-y:auto}#videoGrid{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-content:center;margin:auto}.video-card{position:relative;background:#24262d;border-radius:15px;overflow:hidden;min-height:180px;aspect-ratio:16/9;border:1px solid var(--border)}.video-card video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#17191e}.video-card video.mirror{transform:scaleX(-1)}.participant-name{position:absolute;left:12px;bottom:12px;padding:8px 11px;background:#0009;border-radius:8px;font-size:13px;z-index:2;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status-icons{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:7px}.status-icon{background:#0009;padding:6px 8px;border-radius:7px;font-size:12px}.avatar{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:linear-gradient(140deg,#252e46,#37304c);font-size:50px;font-weight:700;color:white}#chatPanel{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:none;flex-direction:column}.chat-header{height:65px;padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.chat-header button{background:none;color:white;font-size:21px}#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:13px}.message{padding:11px 13px;border-radius:10px;background:var(--panel2);max-width:95%;overflow-wrap:anywhere}.message.own{align-self:flex-end;background:#29436b}.message strong{font-size:12px;color:var(--blue);display:block;margin-bottom:5px}.message p{font-size:14px;line-height:1.5}.message small{display:block;color:var(--muted);font-size:10px;margin-top:6px}.chat-input{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}.chat-input input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:white;outline:none}.chat-input button{background:var(--blue);border-radius:8px;padding:0 15px;font-weight:bold}.bottom-bar{min-height:85px;display:flex;align-items:center;justify-content:center;gap:13px;border-top:1px solid var(--border);padding:12px 18px;flex-shrink:0;background:#15161a}.control{width:52px;height:52px;border-radius:50%;background:var(--panel2);color:white;font-size:21px;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative}.control:hover{background:#3a3e49}.control.active{background:#3b4e6c}.control.off,.control.leave{background:var(--red)}.control.leave{width:65px;border-radius:18px}.control span{font-size:10px;position:absolute;bottom:-17px;white-space:nowrap;color:var(--muted)}#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:10px;background:#30343d;color:white;font-size:13px;z-index:200;display:none;box-shadow:0 5px 25px #0006}#connectionStatus{font-size:12px;color:var(--muted)}#chatBadge{display:none;position:absolute;top:0;right:0;width:10px;height:10px;background:var(--red);border-radius:50%}@media(max-width:700px){.topbar{padding:0 12px;height:58px}.topbar .logo{font-size:18px}.room-info{gap:6px}.room-info #connectionStatus{display:none}.copy-btn{padding:9px;font-size:11px}.video-area{padding:10px}#videoGrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px}.video-card{min-height:120px}#chatPanel{position:absolute;inset:58px 0 82px;width:100%;z-index:10;border-left:none}.bottom-bar{min-height:75px;gap:10px;padding:10px 5px}.control{width:46px;height:46px;font-size:18px}.control.leave{width:53px}.control span{display:none}.login-card{padding:26px}}@media(max-width:380px){.bottom-bar{gap:6px}.control{width:41px;height:41px}.control.leave{width:47px}}
</style></head>
<body>
<section id="loginScreen"><div class="login-card"><div class="logo">Meet<span>Space</span></div><h1>Entre na chamada</h1><p>Conecte-se com outras pessoas por vídeo, áudio e mensagens em tempo real.</p><input id="userName" type="text" maxlength="30" placeholder="Digite seu nome" autocomplete="name"><button class="primary-btn" id="joinBtn">Entrar na sala</button><div id="loginError"></div></div></section>
<section id="meetingScreen"><header class="topbar"><div class="logo">Meet<span>Space</span></div><div class="room-info"><span id="connectionStatus">Conectando...</span><span id="participantCount">0 participantes</span><button class="copy-btn" id="copyLinkBtn">🔗 Copiar Link da Sala</button></div></header><main class="main-content"><section class="video-area"><div id="videoGrid"></div></section><aside id="chatPanel"><div class="chat-header"><strong>Chat da reunião</strong><button id="closeChatBtn" aria-label="Fechar chat">×</button></div><div id="messages"></div><form class="chat-input" id="chatForm"><input id="chatInput" type="text" maxlength="1000" placeholder="Digite uma mensagem..." autocomplete="off"><button type="submit">➤</button></form></aside></main><footer class="bottom-bar"><button class="control active" id="micBtn" title="Microfone">🎤<span>Microfone</span></button><button class="control active" id="cameraBtn" title="Câmera">📷<span>Câmera</span></button><button class="control" id="screenBtn" title="Compartilhar tela">🖥️<span>Tela</span></button><button class="control" id="chatBtn" title="Abrir chat">💬<i id="chatBadge"></i><span>Chat</span></button><button class="control leave" id="leaveBtn" title="Sair da chamada">📞<span>Sair</span></button></footer></section><div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let roomId=params.get('room');
let isHost=!roomId;
if(isHost){roomId='sala-'+crypto.randomUUID().replaceAll('-','').slice(0,16);history.pushState({},'', '?room='+encodeURIComponent(roomId));}
let peer=null,myId=null,myName='',localStream=null,screenStream=null,sharingScreen=false,micEnabled=true,cameraEnabled=true;
const members=new Map(),dataConnections=new Map(),mediaConnections=new Map(),pendingCalls=new Set();
let unreadMessages=0,chatOpen=false,joined=false,toastTimer=null;
function toast(message,duration=3500){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',duration)}
function setStatus(message){$('connectionStatus').textContent=message}
function updateCount(){$('participantCount').textContent=(members.size+1)+(members.size===0?' participante':' participantes')}
function updateControls(){$('micBtn').classList.toggle('off',!micEnabled);$('micBtn').classList.toggle('active',micEnabled);$('micBtn').textContent=micEnabled?'🎤':'🔇';$('cameraBtn').classList.toggle('off',!cameraEnabled);$('cameraBtn').classList.toggle('active',cameraEnabled);$('cameraBtn').textContent=cameraEnabled?'📷':'🚫';$('screenBtn').classList.toggle('active',sharingScreen);$('screenBtn').textContent=sharingScreen?'⏹️':'🖥️';$('chatBtn').classList.toggle('active',chatOpen)}
function createVideoCard(id,name,stream,local=false){const card=document.createElement('div');card.className='video-card';card.id='card-'+id;const video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=local;video.srcObject=stream;if(local)video.classList.add('mirror');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(name||'?').charAt(0).toUpperCase();const label=document.createElement('div');label.className='participant-name';label.textContent=name+(local?' (Você)':'');const status=document.createElement('div');status.className='status-icons';status.id='status-'+id;const mic=document.createElement('span');mic.className='status-icon';mic.textContent='🎤';status.append(mic);card.append(video,avatar,label,status);$('videoGrid').append(card);video.play().catch(()=>{});avatar.style.display=local&&!cameraEnabled?'flex':'none';return card}
function updateVideoStatus(id,mic,camera){const card=$('card-'+id);if(!card)return;const status=$('status-'+id);if(status){status.replaceChildren();const m=document.createElement('span');m.className='status-icon';m.textContent=mic?'🎤':'🔇';status.append(m);if(!camera){const c=document.createElement('span');c.className='status-icon';c.textContent='📷';status.append(c)}}const video=card.querySelector('video'),avatar=card.querySelector('.avatar');if(avatar)avatar.style.display=camera?'none':'flex';if(video)video.style.visibility=camera?'visible':'hidden'}
function removeParticipant(id){$('card-'+id)?.remove();members.delete(id);pendingCalls.delete(id);const media=mediaConnections.get(id);if(media){media.close();mediaConnections.delete(id)}const data=dataConnections.get(id);if(data){data.close();dataConnections.delete(id)}updateCount()}
function addMessage(name,message,own=false){const item=document.createElement('div');item.className='message'+(own?' own':'');const author=document.createElement('strong');author.textContent=name;const content=document.createElement('p');content.textContent=message;const time=document.createElement('small');time.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});item.append(author,content,time);$('messages').append(item);$('messages').scrollTop=$('messages').scrollHeight;if(!chatOpen&&!own){unreadMessages++;$('chatBadge').style.display='block'}}
function sendToAll(payload){dataConnections.forEach(conn=>{if(conn.open)try{conn.send(payload)}catch(e){console.warn(e)}})}
function sendChatMessage(message){addMessage(myName,message,true);sendToAll({type:'chat',name:myName,message,sender:myId,time:Date.now()})}
function sendRoster(conn){if(!conn?.open)return;const list=[{id:myId,name:myName,mic:micEnabled,camera:cameraEnabled},...Array.from(members.entries()).map(([id,info])=>({id,name:info.name,mic:info.mic,camera:info.camera}))];conn.send({type:'roster',members:list})}
function broadcastRoster(){if(!isHost)return;dataConnections.forEach(sendRoster);updateCount()}
function setupDataConnection(conn){const id=conn.peer,existing=dataConnections.get(id);if(existing&&existing!==conn&&existing.open){conn.close();return}dataConnections.set(id,conn);conn.on('open',()=>{if(isHost&&!members.has(id)){const meta=conn.metadata||{};members.set(id,{name:meta.name||'Participante',mic:true,camera:true});ensureMediaConnection(id);broadcastRoster();sendRoster(conn)}});conn.on('data',payload=>{if(!payload||typeof payload!=='object')return;if(payload.type==='hello'&&isHost){if(!members.has(id))members.set(id,{name:payload.name||'Participante',mic:true,camera:true});ensureMediaConnection(id);sendRoster(conn);broadcastRoster();updateCount();return}if(payload.type==='roster'){processRoster(payload.members||[]);return}if(payload.type==='chat'){if(typeof payload.message==='string')addMessage(payload.name||'Participante',payload.message.slice(0,1000));return}if(payload.type==='status'){const m=members.get(id);if(m){m.mic=!!payload.mic;m.camera=!!payload.camera;updateVideoStatus(id,m.mic,m.camera)}return}if(payload.type==='leave'){removeParticipant(id);if(isHost)broadcastRoster()}});conn.on('close',()=>{if(dataConnections.get(id)===conn)dataConnections.delete(id);if(members.has(id)){removeParticipant(id);if(isHost)broadcastRoster()}});conn.on('error',e=>console.warn('Data connection:',e))}
function processRoster(list){const ids=new Set(list.map(x=>x.id));list.forEach(item=>{if(!item.id||item.id===myId)return;members.set(item.id,{name:item.name||'Participante',mic:item.mic!==false,camera:item.camera!==false});ensureDataConnection(item.id);ensureMediaConnection(item.id)});for(const id of [...members.keys()])if(!ids.has(id))removeParticipant(id);updateCount()}
function ensureDataConnection(id){if(!peer||id===myId)return;const existing=dataConnections.get(id);if(existing&&(existing.open||!existing.closed))return;if(myId.localeCompare(id)>0)return;try{setupDataConnection(peer.connect(id,{reliable:true,serialization:'json',metadata:{name:myName}}))}catch(e){console.warn(e)}}
function getOutgoingStream(){const video=sharingScreen?screenStream?.getVideoTracks()[0]:localStream?.getVideoTracks()[0];const audio=localStream?.getAudioTracks()[0];return new MediaStream([video,audio].filter(Boolean))}
function ensureMediaConnection(id){if(!peer||!localStream||id===myId||mediaConnections.has(id)||pendingCalls.has(id)||myId.localeCompare(id)>0)return;pendingCalls.add(id);try{const call=peer.call(id,getOutgoingStream(),{metadata:{name:myName}});if(!call){pendingCalls.delete(id);return}setupMediaConnection(call)}catch(e){pendingCalls.delete(id);console.error(e)}}
function setupMediaConnection(call){const id=call.peer;pendingCalls.delete(id);const previous=mediaConnections.get(id);if(previous&&previous!==call)previous.close();mediaConnections.set(id,call);call.on('stream',stream=>{const member=members.get(id);$('card-'+id)?.remove();createVideoCard(id,member?.name||call.metadata?.name||'Participante',stream);updateVideoStatus(id,member?.mic!==false,member?.camera!==false);updateCount()});call.on('close',()=>{if(mediaConnections.get(id)===call)mediaConnections.delete(id);pendingCalls.delete(id)});call.on('error',e=>console.warn('Media connection:',e))}
function initializePeer(){const options={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}],sdpSemantics:'unified-plan'}};peer=isHost?new Peer(roomId,options):new Peer(options);peer.on('open',id=>{myId=id;setStatus('Conectado ao servidor');createVideoCard(myId,myName,localStream,true);if(isHost){toast('Sala criada! Compartilhe o link.');updateCount()}else connectToHost()});peer.on('call',call=>{call.answer(getOutgoingStream());setupMediaConnection(call)});peer.on('connection',setupDataConnection);peer.on('error',error=>{console.error('PeerJS:',error);if(error.type==='unavailable-id')showLoginError('Esta sala já está ocupada ou não pode ser criada. Gere outra sala.');else if(error.type==='peer-unavailable'&&!isHost)toast('Anfitrião não encontrado. Verifique o link ou tente novamente.');else toast('Problema na conexão. Verifique sua internet.')});peer.on('disconnected',()=>{setStatus('Reconectando...');if(!peer.destroyed)peer.reconnect()})}
function connectToHost(){setStatus('Entrando na sala...');const conn=peer.connect(roomId,{reliable:true,serialization:'json',metadata:{name:myName}});setupDataConnection(conn);conn.on('open',()=>{conn.send({type:'hello',name:myName});setStatus('Conectado à sala');toast('Você entrou na reunião!')});conn.on('error',()=>toast('Não foi possível conectar ao anfitrião.'));setTimeout(()=>{if(!conn.open&&joined)toast('Aguardando o anfitrião da sala...')},6000)}
function showLoginError(message){$('loginError').textContent=message}
async function joinMeeting(){if(joined)return;myName=$('userName').value.trim();if(!myName){showLoginError('Digite seu nome para continuar.');return}if(!navigator.mediaDevices?.getUserMedia){showLoginError('Seu navegador não permite câmera e microfone. Utilize HTTPS ou localhost.');return}if(!window.Peer){showLoginError('Não foi possível carregar o sistema de conexão.');return}$('joinBtn').disabled=true;$('joinBtn').textContent='Solicitando permissões...';try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'}});joined=true;$('loginScreen').style.display='none';$('meetingScreen').style.display='flex';initializePeer();updateControls()}catch(error){console.error(error);joined=false;showLoginError(error.name==='NotAllowedError'||error.name==='PermissionDeniedError'?'Permissão negada. Autorize câmera e microfone nas configurações do navegador.':error.name==='NotFoundError'?'Não encontramos câmera ou microfone disponível.':error.name==='NotReadableError'?'A câmera ou o microfone já está sendo usado por outro aplicativo.':'Não foi possível acessar os dispositivos. Verifique as permissões e tente novamente.');$('joinBtn').disabled=false;$('joinBtn').textContent='Entrar na sala'}}
$('joinBtn').addEventListener('click',joinMeeting);$('userName').addEventListener('keydown',e=>{if(e.key==='Enter')joinMeeting()});
$('micBtn').addEventListener('click',()=>{if(!localStream)return;micEnabled=!micEnabled;localStream.getAudioTracks().forEach(t=>t.enabled=micEnabled);updateControls();updateVideoStatus(myId,micEnabled,cameraEnabled);sendToAll({type:'status',mic:micEnabled,camera:cameraEnabled})});
$('cameraBtn').addEventListener('click',()=>{if(!localStream)return;cameraEnabled=!cameraEnabled;localStream.getVideoTracks().forEach(t=>t.enabled=cameraEnabled);updateControls();updateVideoStatus(myId,micEnabled,cameraEnabled);sendToAll({type:'status',mic:micEnabled,camera:cameraEnabled})});
async function replaceOutgoingVideoTrack(track){await Promise.all([...mediaConnections.values()].map(async call=>{const pc=call.peerConnection;if(!pc)return;const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track)}))}
async function stopScreenShare(){if(!sharingScreen)return;sharingScreen=false;try{await replaceOutgoingVideoTrack(localStream.getVideoTracks()[0])}catch(e){console.error(e);toast('Não foi possível restaurar a câmera em algumas conexões.')}const video=$('card-'+myId)?.querySelector('video');if(video)video.srcObject=localStream;screenStream?.getTracks().forEach(t=>t.stop());screenStream=null;updateControls();toast('Compartilhamento encerrado.')}
async function startScreenShare(){if(!navigator.mediaDevices?.getDisplayMedia){toast('Seu navegador ou dispositivo não suporta compartilhamento de tela. Tente em um computador.');return}try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});const track=screenStream.getVideoTracks()[0];if(!track)throw new Error('Nenhuma faixa de vídeo.');await replaceOutgoingVideoTrack(track);sharingScreen=true;const video=$('card-'+myId)?.querySelector('video');if(video)video.srcObject=screenStream;track.addEventListener('ended',stopScreenShare,{once:true});updateControls();toast('Sua tela está sendo compartilhada.')}catch(e){console.error(e);toast(e.name==='NotAllowedError'?'Você cancelou ou negou o compartilhamento.':'Não foi possível compartilhar sua tela.')}}
$('screenBtn').addEventListener('click',()=>sharingScreen?stopScreenShare():startScreenShare());
$('chatBtn').addEventListener('click',()=>{chatOpen=!chatOpen;$('chatPanel').style.display=chatOpen?'flex':'none';if(chatOpen){unreadMessages=0;$('chatBadge').style.display='none'}updateControls()});$('closeChatBtn').addEventListener('click',()=>{chatOpen=false;$('chatPanel').style.display='none';updateControls()});$('chatForm').addEventListener('submit',e=>{e.preventDefault();const input=$('chatInput'),message=input.value.trim();if(!message)return;sendChatMessage(message);input.value=''})
$('copyLinkBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link da sala copiado!')}catch(e){const input=document.createElement('textarea');input.value=location.href;document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();toast(ok?'Link da sala copiado!':'Não foi possível copiar. Copie o endereço do navegador.')}})
function leaveMeeting(){if(!joined)return;sendToAll({type:'leave'});if(sharingScreen)screenStream?.getTracks().forEach(t=>t.stop());localStream?.getTracks().forEach(t=>t.stop());mediaConnections.forEach(c=>c.close());dataConnections.forEach(c=>c.close());if(peer&&!peer.destroyed)peer.destroy();joined=false;location.href=location.pathname}
$('leaveBtn').addEventListener('click',()=>{if(confirm('Deseja realmente sair da chamada?'))leaveMeeting()});
console.log('MeetSpace | Sala:',roomId,'| Anfitrião:',isHost);
</script></body></html>
